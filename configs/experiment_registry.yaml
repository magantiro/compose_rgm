  N_max: 20000
  N_min: 500
  enumeration_target: K-step reachable set S_K(x0) under the REAL production executor
  fallback: If no single feasible graph contains both trans-dimensional and cyclic behaviour, build TWO
    exact benchmarks (a cardinality slice and a cycle/topology slice) rather than omitting either capability.
    If even the smallest candidate exceeds the caps, report INFEASIBLE; never approximate and call it
    exact.
  independent_verification: on the smallest slice, dynamic-programming propagation is cross-checked against
    explicit path enumeration; agreement is required, so the solver is not merely self-consistent
  merge: identical molecular states merged by production canonical_state_key
