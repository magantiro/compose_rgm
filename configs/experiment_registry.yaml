# RingCore-V1 / COMPOSE ICLR experiment registry -- AUTHORITATIVE, FROZEN BEFORE RESULTS
#
# Converts the A-G program in docs/PAPER1_FRAMING_AUTHORITATIVE.md section 7 into executable, frozen
# specifications. This registry is NOT a new experimental story: ids E1-E7 map one-to-one onto the
# existing A-G table, and every metric listed there is preserved here.
#
#   E1 <- A   unconditional RingCore generation        (needs a SEPARATE de-novo checkpoint)
#   E2 <- B   learned transport vs uniform legal        (editing prior)
#   E3 <- C   trans-dimensional size adaptation         (editing prior)
#   E4 <- D   topological adaptation                    (editing prior)
#   E5 <- E   canonical-successor quotient invariance   (mechanism test, any checkpoint)
#   E6 <- F   exact enumerable finite-horizon control   (toy, no learned checkpoint required)
#   E7 <- G   conditional / dynamic molecular design    (frozen editing prior)
#
# Why freeze this before seeing results: the failure mode is running dozens of scripts that cannot later
# be assembled into a fair paper. Objectives, splits, budgets, seeds, success definitions and
# normalizations are all declared HERE, ahead of time, so no choice can be made to flatter an outcome.
#
# CHECKPOINT DISCIPLINE
#   editing_prior  = the run pinned below. Supports E2, E3, E4, E7, and supplies a learned kernel to
#                    parts of E5/E6.
#   denovo         = DOES NOT EXIST. E1 is blocked on it. The editing run logs
#                    `de_novo_records_built 0`, so it must never be cited as evidence for unconditional
#                    timed-CTMC generation.

schema: compose.experiments.registry
schema_version: 1

provenance:
  editing_prior:
    run_id: compose-v4-ringcore-v1-scientific-nitya-6d067e9-v1
    status: TRAINING_IN_PROGRESS
    workspace: nitya
    git_commit: 6d067e9
    effective_manifest_hash: 5c5c254e1054c081
    exclusion_overlay_hash: 32372dc5d73139a7
    sampler_hash: 794e6628f23465d8
    scheduler_hash: dafd4b5092414394
    checkpoints: [500, 1000, 2000, 3000, 4500, 6000, 9000, 12000, 14000, 16000]
    selection_rule: >-
      production-weighted canonical-successor NLL (primary); balanced-family canonical-successor NLL
      (secondary); held-source/scaffold/topology safeguards; calibration and rollout behaviour as
      tie-breakers; hazard calibration reported SEPARATELY and never used to select the editing
      checkpoint. 16,000 is the maximum observation horizon and does not preselect.
  denovo:
    run_id: null
    status: DOES_NOT_EXIST
    blocked_by:
      - DENOVO_BOND_REORDER_INVALID_REWRITE  # diagnostics/defects/
      - timed-CTMC hazard semantics unverified
      - de-novo corpus + contract + gates not built

# Shared frozen protocol. Anything here is fixed for every experiment that references it.
protocol:
  seeds: [0, 1, 2, 3, 4]
  successor_kernel: canonical            # aggregate over syntactic aliases; NEVER raw marks
  editing_budget_convention: fixed_step_embedded_jump_chain
  held_out_policy: >-
    ringcore-v1 scaffold key (murcko+carbonized-wl3, salt ringcore-v1, 0.9/0.05/0.05). Validation and
    test partitions are molecule-disjoint from train: verified 0 source and 0 scaffold overlap.
  similarity: {fingerprint: ECFP4, radius: 2, bits: 2048, metric: tanimoto}
  independent_evaluation_oracle: required_where_available
  normalization_policy: >-
    declared per objective BEFORE any model output is inspected; post-hoc renormalization is forbidden.

experiments:

  E2:
    title: Learned transport versus uniform legal rewriting
    maps_to: B
    question: >-
      Did the neural process learn chemistry, or is it merely operating a hand-built valid rule system?
    checkpoint: editing_prior
    priority: 1                          # first experiment after checkpoint freeze
    dataset: held-out MMP + scaffold source/target pairs (validation partition)
    arms:
      learned: sample from P_theta(y|x) under the frozen editing kernel
      uniform_legal: >-
        identical executor, identical legal successor set, uniform over CANONICAL MOLECULAR SUCCESSORS
        (1/|N(x)|). Uniformity over raw action marks is WRONG here -- it would privilege successors with
        more symmetric encodings, so the baseline must be built at the quotient level.
    primary_metric: held_out_canonical_successor_nll
    secondary_metrics:
      - analogue_target_recovery
      - productive_molecular_displacement
      - fraction_steps_improving_endpoint_similarity
      - path_length
      - path_overhead
      - immediate_reversal_rate
      - longer_cycle_rate
      - net_vs_gross_edits
      - endpoint_distribution_fidelity
      - oracle_calls_per_successful_endpoint
    failure_criterion: >-
      learned arm fails to beat uniform-legal on canonical-successor NLL, or shows no reduction in
      reversal/cycle rate -- i.e. the model adds no chemistry over legal-move enumeration.
    outputs: [results/E2_learned_vs_uniform.json]
    panel: Figure 2 (transport) + transport ablation table

  E3:
    title: Trans-dimensional size adaptation
    maps_to: C
    question: Does one trajectory change molecular cardinality on demand, including overshoot correction?
    checkpoint: editing_prior
    priority: 4
    tasks:
      - source_too_small_target_larger
      - source_too_large_target_smaller
      - grow_then_switch_to_smaller_preferred_range   # tests correction within ONE trajectory
      - held_out_atom_count_bins
      - matched_sources_unsolvable_at_fixed_cardinality
    per_step_records:
      [active_atom_count, insertions, deletions, net_cardinality_change, overshoot, correction,
       steps_to_enter_target_interval, terminal_success, similarity_retained, validity, connectedness]
    baselines: [unguided_editing, insertion_disabled, deletion_disabled, fixed_cardinality_operators,
                endpoint_reranking, greedy_local_controller, full_learned_controller]
    primary_metric: fraction_reaching_target_atom_count_interval
    failure_criterion: >-
      insertion/deletion-disabled arms match the full operator set -- would mean cardinality change is
      not actually load-bearing.
    outputs: [results/E3_size_adaptation.json]
    panel: Figure 2 (size)

  E4:
    title: Topological adaptation
    maps_to: D
    question: Does the learned process restructure rings rather than only decorate them?
    checkpoint: editing_prior
    priority: 4
    tasks: [cycle_creation, cycle_opening, ring_size_change, fused_system_modification,
            spiro_or_bridged_change_where_supported, topology_simplification,
            topology_addition_then_reversal_after_objective_switch]
    metrics: [cycle_rank, ring_system_count, ring_size_distribution, topology_class_recovery,
              held_out_topology_success, edit_efficiency, valid_path_rate, ring_operation_utilization,
              unnecessary_cycle_open_close, final_property, final_similarity]
    ablations: [ringcore_v1, no_cycle_operations, finite_catalog_alternative]
    ablation_note: >-
      Do NOT re-enable the obsolete ring_system_grow macro just to manufacture an ablation. Baselines
      must be runnable, scientifically meaningful alternatives.
    primary_metric: held_out_topology_class_recovery
    failure_criterion: no-cycle-operations arm matches RingCore-V1 on topology recovery.
    outputs: [results/E4_topology_adaptation.json]
    panel: Figure 2 (topology)

  E5:
    title: Canonical-successor quotient invariance
    maps_to: E
    question: Is the molecular kernel invariant to internal action encoding?
    checkpoint: any            # mechanism test; synthetic fixtures carry most of it
    priority: 6
    checks:
      - raw_mark_multiplicity_differs
      - aggregate_canonical_successor_mass_identical
      - sampled_successor_frequency_matches_aggregate_mass
      - persistent_slot_relabeling_leaves_kernel_unchanged
      - within_fiber_action_refinement_leaves_state_law_unchanged
      - exact_control_on_quotient_invariant_to_refinement
    scope_caveat: >-
      Invariance holds when refinement occurs WITHIN a successor fiber and the controller acts on
      successors. It does NOT hold for a controller that rewards particular mark encodings directly.
      State this precisely; do not over-claim.
    primary_metric: max_abs_deviation_in_successor_mass
    failure_criterion: any nonzero deviation beyond float tolerance.
    outputs: [results/E5_quotient_invariance.json]
    panel: Extended Data (quotient fixtures)

  E6:
    title: Exact enumerable finite-horizon control
    maps_to: F
    question: Is the finite-horizon Doob transform exact on a real RingCore kernel?
    checkpoint: none           # toy; learned kernel inserted later where relevant
    priority: 5
    construction: >-
      Bounded chemistry where the PRODUCTION executor and RingCore semantics remain real but the full
      reachable state graph is enumerable. Rebuild on the CURRENT production operator set -- not a
      historical one.
    precompute: [all_valid_states, all_legal_actions, canonical_successors, aggregate_rates,
                 transition_matrices_by_remaining_budget, connected_components,
                 terminal_distributions, exact_backward_values]
    tilts: [rare_motif, atom_count_interval, property_interval, two_simultaneous_constraints,
            boltzmann_reward, small_objective_space_region]
    implement: [exact_finite_horizon_doob, support_preservation, terminal_law_residual,
                dynamic_objective_replacement, exact_continuation_from_intermediate, restart_control,
                endpoint_reranking, greedy_reward, local_boltzmann, learned_value, smc_feynman_kac]
    primary_metric: terminal_law_total_variation_residual
    failure_criterion: Doob terminal law deviates from the analytic tilt beyond solver tolerance.
    outputs: [results/E6_exact_control.json]
    panel: Figure 3

  E7:
    title: Conditional and dynamic molecular design
    maps_to: G
    question: Does control act on the kernel, and does it survive a mid-trajectory objective change?
    checkpoint: editing_prior  # FROZEN, identical across every controller arm
    priority: 2
    same_base_requirement: >-
      Every controller shares the same frozen prior, executor, source molecules, budgets, oracles and
      successor support. Only the control law varies -- that is what isolates the causal claim.
    controllers: [unguided_prior, endpoint_reranking, greedy_one_step_reward, local_boltzmann,
                  scalarized_guidance, mog_dfm_style, smc_feynman_kac, learned_doob_value]
    external_baselines: [GraphGA, MARS, RetMol, GenMol, GrIDDD, pareto_gflownet]
    external_note: >-
      Contextual only. They do NOT replace the same-base comparison, because only the same-base table
      isolates the control law from the generative process.
    records: [generated_endpoints, all_intermediate_states, base_kernel_log_probability,
              controller_correction, oracle_calls, compute, effective_sample_size,
              constraint_violations, success, pareto_metrics]
    flagship_studies:
      dynamic_preference_switching:
        arms: [continuation_from_current_molecule, restart_from_original_source,
               restart_from_switch_state_separate_sampler, static_compromise_objective]
        metrics: [adaptation_regret, retained_gain_on_old_objective, final_gain_on_new_objective,
                  edit_cost, oracle_cost, time_to_adapt]
      pareto_fan:
        design: one shared valid prefix branched under multiple preference vectors
        metrics: [prefix_reuse, endpoint_spread, hypervolume, region_coverage, branch_diversity,
                  cost_vs_independent_restarts]
      pathwise_constraints:
        enforced_at_every_committed_state:
          [scaffold_protection, pharmacophore_retention, atom_count_interval, charge_policy,
           structural_alert_exclusion, similarity_corridor_optional]
        compare_against: endpoint_only_filtering
        metrics: [invalid_or_forbidden_intermediate_states, wasted_oracle_calls, endpoint_yield,
                  path_feasibility, cost]
    multi_objective_predeclared:
      two_objective: for clear Pareto visualization
      three_objective: stronger evaluation
      four_or_five_objective: aggregate stress test
      hypervolume_reference_points: MUST be fixed before results are seen
      dominance_convention: epsilon-dominance, epsilon declared per objective
      diversity_measurement: required
      source_similarity_floor: required
    primary_metric: feasible_hypervolume_per_oracle_call
    failure_criterion: >-
      learned control does not beat greedy/reranking at matched oracle budget, or continuation shows no
      advantage over restart after an objective switch.
    outputs: [results/E7_conditional_dynamic.json]
    panel: Figure 4 + Tables 2/3

  E1:
    title: Credible unconditional RingCore generation
    maps_to: A
    question: Does the timed CTMC generate credible molecules de novo?
    checkpoint: denovo
    status: BLOCKED
    priority: 8
    blocking_note: >-
      Requires a SEPARATE de-novo checkpoint that does not exist. The editing run reports
      `de_novo_records_built 0`; using it here would be a false claim about unconditional generation.
    metrics: [all_step_validity, endpoint_validity, connectedness, uniqueness, novelty,
              internal_diversity, fcd, precision_recall_or_coverage, scaffold_novelty,
              size_distribution, property_distribution, ring_topology_distribution,
              nearest_neighbor_memorization, throughput]
    outputs: [results/E1_unconditional.json]
    panel: Figure 2 (generation) + Table 1

# Dependency DAG. Nothing here may be reordered to make a result look better.
dag:
  - {id: E5, depends_on: [], note: synthetic fixtures; runnable NOW}
  - {id: E6, depends_on: [], note: enumerable graph; runnable NOW on CPU}
  - {id: E2, depends_on: [editing_prior_frozen]}
  - {id: E3, depends_on: [editing_prior_frozen]}
  - {id: E4, depends_on: [editing_prior_frozen]}
  - {id: E7, depends_on: [editing_prior_frozen, E2]}
  - {id: E1, depends_on: [denovo_checkpoint], note: BLOCKED
}
