name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: src
      COMPOSE_REFERENCE_CHECKPOINT: local_assets/fragments/r_theta_nll.pt
      COMPOSE_FRAGMENT_ASSETS: local_assets/fragments
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/test.txt
      - name: Install test environment
        run: python -m pip install -r requirements/test.txt -e .
      - name: Verify shared molecular reference
        run: |
          python tools/verify_shared_reference.py
          python tools/verify_qed_assets.py
      - name: Fetch pinned fragment evaluator
        run: python tools/fetch_fragment_evaluator.py --download
      - name: Run offline tests
        run: python -m pytest -q -p no:cacheprovider tests/
      - name: Lint task interfaces and tools
        run: |
          ruff check tests tools examples \
            src/compose_v4/experiments/fragments \
            src/compose_v4/experiments/pmo \
            src/compose_v4/experiments/pmo_panel.py \
            src/compose_v4/experiments/hphi_region_features.py \
            src/compose_v4/experiments/qed_goal_regions.py \
            src/compose_v4/experiments/qed_shared* \
            src/compose_v4/experiments/t4 \
            src/compose_v4/model/reference_checkpoint.py \
            src/compose_v4/control/reference_guidance.py \
            src/compose_v4/control/reference_programs.py
          ruff format --check tests tools examples \
            src/compose_v4/experiments/fragments \
            src/compose_v4/experiments/pmo \
            src/compose_v4/experiments/pmo_panel.py \
            src/compose_v4/experiments/hphi_region_features.py \
            src/compose_v4/experiments/qed_goal_regions.py \
            src/compose_v4/experiments/qed_shared* \
            src/compose_v4/experiments/t4 \
            src/compose_v4/model/reference_checkpoint.py \
            src/compose_v4/control/reference_guidance.py \
            src/compose_v4/control/reference_programs.py

  pmo-oracle-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/pmo-oracle.txt
      - name: Install isolated PMO oracle environment
        run: |
          python -m pip install -r requirements/pmo-oracle.txt
          python -m pip install --no-deps PyTDC==1.1.15
      - name: Check PMO chemistry kernel without oracle calls
        run: PYTHONPATH=src python -m compose_v4.experiments.pmo_oracle_worker --check-env
