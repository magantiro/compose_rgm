# =============================================================================
# Grid-expanded comparison tables (DRY). build_results_tex.py expands each
# grid into pending keys <prefix>_<metric.key>_<method.key>, all status:pending.
# =============================================================================
grids:

  - prefix: "H1"
    resampling_unit: "source"
    claim_key: "C-HV-IMPROVE"
    metrics:
      - {key: "NHV",        unit: "nHV",     direction: higher_better, description: "Normalized hypervolume at the shared oracle budget."}
      - {key: "HVAUC",      unit: "HV-AUC",  direction: higher_better, description: "Hypervolume area under the oracle-call curve."}
      - {key: "IGD",        unit: "IGD+",    direction: lower_better,  description: "Inverted generational distance plus to the pooled reference front."}
      - {key: "FEASIBLE",   unit: "count",   direction: higher_better, description: "Number of feasible nondominated molecules."}
      - {key: "SOURCESIM",  unit: "sim",     direction: higher_better, description: "Median Morgan similarity of nondominated molecules to their source."}
      - {key: "DIVERSITY",  unit: "div",     direction: higher_better, description: "Internal diversity of the nondominated set."}
      - {key: "ORACLEEFF",  unit: "%",       direction: higher_better, description: "Fraction of oracle calls spent on feasible candidates."}
    methods:
      - {key: "UNGUIDED",    label: "Unguided edit prior"}
      - {key: "RERANK",      label: "Endpoint + rerank"}
      - {key: "GREEDY",      label: "Greedy $\\Delta f$"}
      - {key: "BOLTZMANN",   label: "Local Boltzmann"}
      - {key: "MOGDFM",      label: "MOG-DFM-style"}
      - {key: "SMCFK",       label: "SMC / Feynman--Kac"}
      - {key: "LEARNEDDOOB", label: "Learned Doob (ours)"}
      - {key: "GRAPHGA",     label: "GraphGA"}
      - {key: "MARS",        label: "MARS"}
      - {key: "GENMOL",      label: "GenMol"}
      - {key: "RETMOL",      label: "RetMol"}
