# results_registry.yaml
# -----------------------------------------------------------------------------
# EMPIRICAL RESULTS. Every entry is `status: pending` until the corresponding
# run completes and a machine-readable artifact is attached (`source_artifact`).
# NOTHING here may be filled by hand from memory or expectation.
#
# Rendered by \Result{KEY} (scalar), \ResultCI{KEY} (value with CI), and
# \ResultSentence{KEY} (prewritten interpretation sentence). In DRAFT mode a
# pending key renders as a loud red placeholder box; in FINAL mode
# check_placeholders.py FAILS the build while any pending key remains.
#
# Per-key schema:
#   status:          pending | final
#   value:           null while pending; the number/string when final
#   ci:              null | [lo, hi]      (95% interval; see resampling_unit)
#   unit:            display unit (TV, %, kcal/mol, calls, ...)
#   direction:       lower_better | higher_better | none
#   n_seeds:         stochastic repetitions backing the estimate (null pending)
#   n_tasks:         tasks/sources aggregated (null pending)
#   resampling_unit: bootstrap unit (source | task | trajectory | ...)
#   description:     what the number measures (one line)
#   source_artifact: path to the machine-readable artifact (null pending)
#   claim_key:       CLAIM_LEDGER.md ID this number supports
# -----------------------------------------------------------------------------

meta:
