[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compose-v4"
version = "0.1.0"
description = "Rewrite Generator Matching for validity-preserving molecular generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "networkx>=3.0",
    "rdkit>=2023.9",
    "scipy>=1.10",
    "torch>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
cloud = [
    "modal>=1.3,<1.4",
]
eval = [
    "fcd-torch==1.0.7",
]
oracle = [
    "joblib>=1.3",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["compose_v4*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
