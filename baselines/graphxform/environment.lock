# --- Known conflicts that must be resolved before any run -------------------
# 1. Dockerfile pins pytorch/pytorch:2.5.1-cuda12.1 while requirements.txt
#    demands torch>=2.6.0. The two cannot both be satisfied. For a CPU-only
#    build, prefer the requirements.txt constraint on a CPU torch wheel.
# 2. guacamol imports `scipy.histogram`, removed in modern scipy. Upstream
#    README documents the patch: use `from numpy import histogram`.
# 3. rdkit~=2023.9.6 DIFFERS from the COMPOSE production pin (rdkit 2024.3.5).
#    The baseline therefore runs in its OWN container; COMPOSE canonicalisation
#    and the frozen oracle must be applied on the COMPOSE side, never inside
#    the GraphXForm container, or the RingCore catalog fingerprint check
#    (639ff6078c32d43c) is meaningless for the comparison.
