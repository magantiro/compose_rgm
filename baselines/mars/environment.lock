# VERIFIED WORKING RECIPE — macOS arm64, 2026-08-13
# ============================================================================
# Upstream's own pins (python 3.9.6 / torch 1.9.0 / dgl 0.7.0) are NOT
# installable here. This is what actually works.
#
#   python3.11 -m venv /tmp/baseline_envs/mars-py311
#   pip install torch==2.1.2 torchdata==0.7.1 "setuptools<71" "numpy<2"
#   pip install dgl==2.2.0 -f https://data.dgl.ai/wheels/torch-2.4/repo.html
#   pip install pydantic rdkit scikit-learn
#
# Verified installed: torch 2.1.2, dgl 2.2.0, rdkit 2026.03.5, numpy 1.26.4,
# scikit-learn 1.9.0. `from dgl.nn.pytorch.glob import Set2Set` imports and runs.
#
# PYTHON 3.11 IS MANDATORY. DGL publishes no wheel for python 3.14.
# TORCH 2.1.2 IS FORCED: DGL's arm64 wheel ships graphbolt dylibs only for
# torch 2.1.0-2.3.0, and torchdata 0.7.1 is the only release matching.
# PYDANTIC IS REQUIRED but undocumented: dgl.graphbolt imports it, so
# `import dgl` fails with ModuleNotFoundError without it.
#
# --- Source patch required ---------------------------------------------------
# estimator/scorer/sa_scorer.py: `from rdkit.six import iteritems` -- rdkit.six
# was removed from modern RDKit. Replace with a local
# `iteritems = lambda d: iter(d.items())`.
#
# --- THE SHIPPED ORACLES: LOADABLE, BUT A NAIVE PORT IS SILENTLY WRONG -------
# A plain unpickle of estimator/scorer/kinase_rf/gsk3b.pkl on scikit-learn 1.9.0
# raises `ModuleNotFoundError: No module named 'sklearn.ensemble.forest'`. The
# pickles were written with scikit-learn 0.19.0 and need THREE independent fixes:
#   1. module renames: sklearn.ensemble.forest -> _forest,
#      sklearn.tree.tree -> _classes
#   2. the tree node dtype gained a `missing_go_to_left` field in sklearn 1.3
#   3. attribute renames: n_features_ -> n_features_in_,
#      base_estimator -> estimator, plus monotonic_cst
#
# THE DANGEROUS ONE, and the reason this block is long: since sklearn 1.3
# `tree_.value` stores class PROPORTIONS and `predict_proba` no longer
# normalizes, while 0.19 stored raw COUNTS. Fixing only the import errors yields
# "probabilities" as large as 1169.7. IT DOES NOT CRASH. MARS would sample
# happily against meaningless scores and the run would look successful.
# Counts must be converted to proportions at load.
#
# VALIDATION THAT MUST BE REPEATED BY ANY FUTURE PORT: after the fix, known
# actives score mean 0.84 (jnk3) and 0.91 (gsk3b), 98-100% above the 0.5 success
# threshold, versus 0.04/0.07 for random ChEMBL at 0-2%. Sanity-correct, not
# merely non-crashing. Never trust a MARS oracle number without this check.
#
# CONSEQUENCE FOR THE FAIRNESS CONTRACT: the required "native-regime MARS row"
# on MARS's own gsk3b/jnk3 objectives IS producible. The remaining cost is
# compute, not archaeology.
#
