# --- Resolution risks that must be settled before any run -------------------
# 1. torch 1.9.0 and dgl 0.7.0 are from 2021. Whether either still resolves on a
#    current index, and whether dgl 0.7.0's API (g.number_of_edges(),
#    dgl.nn.pytorch.glob.Set2Set) still matches, is UNVERIFIED -- nothing was
#    installed. This is the single largest execution risk for MARS.
# 2. The shipped oracle pickles (estimator/scorer/kinase_rf/{gsk3b,jnk3}.pkl)
#    are scikit-learn 0.23.2 artifacts. They are NOT needed for a COMPOSE
#    comparison -- COMPOSE supplies its own frozen oracle -- so the sklearn pin
#    can be relaxed if only the sampler is used. Confirm before relaxing.
# 3. rdkit 2021.03.4 DIFFERS from the COMPOSE production pin (2024.3.5). The
#    baseline runs in its OWN container. All canonicalisation and all oracle
#    evaluation happen on the COMPOSE side; molecules cross the boundary as
#    SMILES only.
#
# --- Prerequisite steps ------------------------------------------------------
# a. The fragment vocabulary is NOT shipped (data/vocab_* is gitignored).
#    Regenerate: python -m MARS.datasets.prepro_vocab
#    Input: data/chembl.txt, 1,488,640 SMILES. Top 1000 fragments, <=10 heavy
#    atoms, single attachment point.
# b. Hardcoded paths require the checkout directory to be literally named MARS,
#    and commands must be run from OUTSIDE it.
#
# --- Checkpoint --------------------------------------------------------------
# NONE. No proposal/editor checkpoint exists upstream and no shipped code path
# writes one. Every run starts from a randomly initialised editor.
